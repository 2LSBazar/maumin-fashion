<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maumin Fashion - ঘরে বসে অর্ডার করুন</title>
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- Splash Screen -->
<div id="splash">
  <img src="assets/logo.png" alt="Maumin Fashion">
</div>

<!-- Overlay for sidebar -->
<div id="overlay"></div>

<!-- Sidebar -->
<div id="sidebar">
  <h3>ক্যাটাগরি সমূহ</h3>
  <ul id="sidebarCatList">
    <li data-cat="all">সকল পণ্য</li>
  </ul>
</div>

<!-- Header -->
<header>
  <button id="menuBtn">&#9776;</button>
  <img src="assets/logo.png" class="logo" alt="logo">
  <span class="brand">Maumin Fashion</span>
  <input type="text" id="searchInput" placeholder="পণ্য খুঁজুন...">
</header>

<!-- Banner -->
<div class="banner-wrap" id="bannerWrap"></div>

<!-- Category chips -->
<div class="cat-scroll" id="catScroll">
  <div class="cat-chip active" data-cat="all">সকল</div>
</div>

<!-- Product Grid -->
<div class="product-grid" id="productGrid">
  <p class="empty-msg">লোড হচ্ছে...</p>
</div>

<!-- Floating WhatsApp -->

</body>
</html>
