<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login - Maumin Fashion</title>
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body style="display:flex;align-items:center;justify-content:center;min-height:100vh;">

<div class="login-box">
  <img src="assets/logo.png" alt="logo" style="width:80px;height:80px;border-radius:50%;display:block;margin:0 auto 12px;">
  <h2 style="text-align:center;color:var(--navy);margin-bottom:20px;">Admin Login</h2>
  <div class="form-group">
    <label>ইমেইল</label>
    <input type="email" id="email" placeholder="admin@email.com">
  </div>
  <div class="form-group">
    <label>পাসওয়ার্ড</label>
    <input type="password" id="password" placeholder="পাসওয়ার্ড">
  </div>
  <button id="loginBtn" class="full-btn">লগইন করুন</button>
  <p id="loginError" style="color:#c0392b;font-size:13px;text-align:center;margin-top:10px;"></p>
</div>

<script type="module" src="js/admin-login.js"></script>
</body>
</html>
