<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel - Maumin Fashion</title>
<link rel="stylesheet" href="css/style.css">
<style>
.admin-wrap{max-width:900px; margin:0 auto; padding:10px;}
.tab-bar{display:flex; gap:6px; overflow-x:auto; padding:10px 0; border-bottom:2px solid #eee; margin-bottom:16px;}
.tab-btn{padding:10px 16px; border:none; background:#f1f1f1; border-radius:20px; white-space:nowrap; font-weight:bold; cursor:pointer;}
.tab-btn.active{background:#111; color:#fff;}
.tab-content{display:none;}
.tab-content.active{display:block;}
.list-row{display:flex; gap:10px; padding:12px; border:1px solid #eee; border-radius:10px; margin-bottom:10px; align-items:flex-start; flex-wrap:wrap;}
.list-row img{width:60px; height:60px; object-fit:cover; border-radius:8px;}
.btn-sm{padding:6px 12px; border-radius:6px; border:none; font-size:13px; cursor:pointer; margin-right:4px; margin-top:4px;}
.btn-dark{background:#111; color:#fff;}
.btn-gray{background:#eee; color:#111;}
.btn-red{background:#dc3545; color:#fff;}
.btn-green{background:#28a745; color:#fff;}
.btn-blue{background:#007bff; color:#fff;}
.btn-yellow{background:#e0a800; color:#fff;}
input[type=text], input[type=number], input[type=tel], textarea, select{
  width:100%; padding:10px; margin:6px 0; border-radius:8px; border:1px solid #ccc; box-sizing:border-box; font-size:15px;
}
.form-section{background:#fafafa; padding:14px; border-radius:10px; margin-bottom:14px;}
.cat-check-box{display:flex; flex-wrap:wrap; gap:8px; padding:10px; border:1px solid #ccc; border-radius:8px; max-height:150px; overflow-y:auto; background:#fff;}
.cat-check-box label{display:flex; align-items:center; gap:6px; background:#f1f1f1; padding:6px 10px; border-radius:16px; font-size:14px;}
.color-row-box, .size-row-box{border:1px solid #ddd; border-radius:8px; padding:10px; margin-bottom:10px; background:#fff;}
.modal-overlay{display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.6); z-index:999; align-items:flex-start; justify-content:center; overflow-y:auto; padding:20px 0;}
.modal-overlay.show{display:flex;}
.modal-box-admin{background:#fff; border-radius:12px; padding:20px; max-width:500px; width:92%; margin:0 auto;}
.img-thumb-row{display:flex; gap:8px; flex-wrap:wrap; margin:8px 0;}
.img-thumb-row img{width:60px; height:60px; object-fit:cover; border-radius:6px;}
</style>
</head>
<body>

<header style="padding:14px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #ddd;">
  <h1 style="margin:0; font-size:18px;">🛠️ Admin Panel - Maumin Fashion</h1>
  <button id="logoutBtn" class="btn-sm btn-red">লগআউট</button>
</header>

<div class="admin-wrap">

  <div class="tab-bar">
    <button class="tab-btn active" data-tab="orders">অর্ডার</button>
    <button class="tab-btn" data-tab="products">পণ্য</button>
    <button class="tab-btn" data-tab="categories">ক্যাটাগরি</button>
    <button class="tab-btn" data-tab="banners">ব্যানার</button>
    <button class="tab-btn" data-tab="settings">সেটিংস</button>
  </div>

  <!-- ORDERS TAB -->
  <div class="tab-content active" id="tab-orders">
    <h2>সকল অর্ডার</h2>
    <div id="ordersList">লোড হচ্ছে...</div>
  </div>

  <!-- PRODUCTS TAB -->
  <div class="tab-content" id="tab-products">
    <h2>পণ্যসমূহ</h2>
    <input type="text" id="productSearchInput" placeholder="পণ্য খুঁজুন...">
    <button id="addProductBtn" class="btn-sm btn-dark" style="margin-bottom:12px;">+ নতুন পণ্য যোগ করুন</button>
    <div id="productsList">লোড হচ্ছে...</div>
  </div>

  <!-- CATEGORIES TAB -->
  <div class="tab-content" id="tab-categories">
    <h2>ক্যাটাগরি</h2>
    <div class="form-section">
      <input type="text" id="newCategoryInput" placeholder="নতুন ক্যাটাগরির নাম">
      <button id="addCategoryBtn" class="btn-sm btn-dark">+ যোগ করুন</button>
    </div>
    <div id="categoriesList">লোড হচ্ছে...</div>
  </div>

  <!-- BANNERS TAB -->
  <div class="tab-content" id="tab-banners">
    <h2>হোমপেজ ব্যানার</h2>
    <div class="form-section">
      <input type="file" id="bannerUploadInput" accept="image/*" multiple>
      <button id="uploadBannerBtn" class="btn-sm btn-dark">আপলোড করুন</button>
    </div>
    <div id="bannersList" class="img-thumb-row">লোড হচ্ছে...</div>
  </div>

  <!-- SETTINGS TAB -->
  <div class="tab-content" id="tab-settings">
    <h2>সেটিংস (বিকাশ)</h2>
    <div class="form-section">
      <label>বিকাশ নাম্বার</label>
      <input type="text" id="bkashNumberInput" placeholder="01XXXXXXXXX">
      <label>বিকাশ QR কোড ছবি</label>
      <input type="file" id="bkashQrInput" accept="image/*">
      <div id="bkashQrPreview"></div>
      <button id="saveBkashBtn" class="btn-sm btn-dark">সেভ করুন</button>
    </div>
  </div>

</div>

<!-- PRODUCT FORM MODAL -->
<div id="productModal" class="modal-overlay">
  <div class="modal-box-admin">
    <h2 id="productModalTitle">নতুন পণ্য</h2>

    <label>পণ্যের নাম</label>
    <input type="text" id="pTitle" placeholder="পণ্যের নাম">

    <label>ক্যাটাগরি (একাধিক বাছাই করা যাবে)</label>
    <div id="pCategoryBox" class="cat-check-box"></div>

    <label>নিয়মিত দাম</label>
    <input type="number" id="pRegPrice" placeholder="৳">

    <label>ডিসকাউন্ট দাম (ঐচ্ছিক)</label>
    <input type="number" id="pDiscPrice" placeholder="৳">
    <div id="pDiscPreview" style="font-size:13px; color:#28a745; font-weight:bold;"></div>

    <label><input type="checkbox" id="pCod" checked style="width:auto;"> ক্যাশ অন ডেলিভারি সুবিধা আছে</label>

    <label>পণ্যের ছবি (একাধিক নির্বাচন করা যাবে)</label>
    <input type="file" id="pImagesInput" accept="image/*" multiple>
    <div id="pImagesPreview" class="img-thumb-row"></div>

    <div class="form-section">
      <h3>রং (Colors)</h3>
      <div id="colorRowsContainer"></div>
      <button id="addColorBtn" class="btn-sm btn-gray">+ রং যোগ করুন</button>
    </div>

    <div class="form-section">
      <h3>সাইজ (Sizes)</h3>
      <div id="sizeRowsContainer"></div>
      <button id="addSizeBtn" class="btn-sm btn-gray">+ সাইজ যোগ করুন</button>
    </div>

    <label>বিবরণ</label>
    <textarea id="pDescription" placeholder="পণ্যের বিবরণ লিখুন" style="min-height:80px;"></textarea>

    <button id="saveProductBtn" class="btn-sm btn-dark" style="width:100%; padding:12px; margin-top:10px;">সেভ করুন</button>
    <button id="closeProductModalBtn" class="btn-sm btn-gray" style="width:100%; padding:12px; margin-top:6px;">বাতিল করুন</button>
  </div>
</div>

<script type="module" src="js/admin.js"></script>
</body>
</html>
